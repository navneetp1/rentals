<div class="container my-4">
  <div class="card shadow-sm" style="max-width: 500px;">
    <div class="card-body">
      <h5 class="card-title">
        <a href="/{{ doc.route |e }}" class="text-decoration-none text-primary">
          {{ doc.title or doc.full_name }}
        </a>
      </h5>

      <p class="card-text mb-1"><strong>Phone:</strong> {{ doc.phone_number }}</p>
      <p class="card-text mb-1"><strong>License:</strong> {{ doc.license_number }}</p>
      <p class="card-text mb-1"><strong>Status:</strong> 
        <span class="badge badge-{{ 'success' if doc.status == 'Available' else 'secondary' }}">
          {{ doc.status }}
        </span>
      </p>
      <p class="card-text"><strong>Rating:</strong> {{ (doc.rating * 10) | int }}</p>
    </div>
  </div>
</div>

<!-- this is a sample default list template -->
