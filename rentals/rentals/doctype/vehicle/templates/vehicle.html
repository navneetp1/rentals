{% extends "templates/web.html" %}
{% block page_content %}
    <h1>{{ doc.title }}</h1>
    <h2>Color: {{ doc.color }}</h2>
    <img src="{{ doc.vehicle_image }}" alt="Image of {{ doc.title }}">

    <a class="btn btn-info" href="/book-a-ride/new?vehicle={{ doc.name }}">Book Ride Now</a>
{% endblock %}

<!-- this is a sample default web page template -->
